[project]
name = "rango-ja"
version = "0.1.0"
description = ""
authors = [
    {name = "ioprudente",email = "ioprudente42@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "fastapi (>=0.143.1,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "pydantic (>=2.14.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "rango_ja", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
