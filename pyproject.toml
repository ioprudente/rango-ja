[tool.poetry]
name = "rango-ja"
version = "0.1.0"
description = "Agente de atendimento com LLM para a Rango Já"
authors = ["ioprudente <ioprudente42@gmail.com>"]
readme = "README.md"
packages = [{ include = "rango_ja", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { version = "^0.30", extras = ["standard"] }
pydantic = "^2.7"
pydantic-settings = "^2.3"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.5"
mypy = "^1.10"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"